[workspace]
resolver = "3"
members = [
    "crates/mcp-core",
    "crates/jobs",
    "crates/mock-mcp",
    "crates/gateway",
    "crates/render-mcp",
    "crates/llm-mcp",
    "crates/scene",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
