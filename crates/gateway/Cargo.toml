[package]
name = "mac-compute-gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "mac_compute_gateway"
path = "src/lib.rs"

[[bin]]
name = "mac-compute-gateway"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
axum = "0.8"
notify = "8"
clap = { version = "4", features = ["derive"] }
mcp-core = { path = "../mcp-core", version = "0.1.0" }
mac-compute-jobs = { path = "../jobs", version = "0.1.0" }
rmcp = { version = "3.5.1", features = ["client", "transport-child-process", "transport-streamable-http-server"] }
serde_json = "1"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
http-body-util = "0.1"
mock-mcp = { path = "../mock-mcp", version = "0.1.0" }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
