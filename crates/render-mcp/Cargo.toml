[package]
name = "render-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "render_mcp"
path = "src/lib.rs"

[[bin]]
name = "render-mcp"
path = "src/main.rs"

[dependencies]
base64 = "0.23"
# Bild-Ebenen: PNG, JPEG und WebP in 8 Bit je Kanal.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
png = "0.17"
pollster = "0.4"
rmcp = { version = "3.5.1", features = ["transport-io"] }
# Für die JSON-Zusammenfassung und die Fehlerzeile im Szenen-Modus; im
# Workspace bereits über mcp-core/jobs etabliert.
scene = { path = "../scene", version = "0.1.0" }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
resvg = "0.48.1"
vello = "0.10"

[lints]
workspace = true
