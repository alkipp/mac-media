# Konfiguration für `cargo deny check`.
#
# Geprüft werden Sicherheitslücken, Lizenzen, doppelte Versionen und die
# Herkunft der Abhängigkeiten. Zielplattform ist ausschließlich der Mac.

[graph]
targets = [{ triple = "aarch64-apple-darwin" }]

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
